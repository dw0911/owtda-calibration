name: Bug report
description: 报告代码、脚本或工具链缺陷
labels: [bug]
body:
  - type: input
    id: commit
    attributes:
      label: Commit / release
      description: `git rev-parse HEAD` 或 release tag
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 命令、配置、输入（**请勿粘贴 secrets 或未公开的私有数据**）
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、Python 版本、`uv sync --frozen` 是否通过、`python scripts/verify_release.py --level quick` 输出
    validations:
      required: true
